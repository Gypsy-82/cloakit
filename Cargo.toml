[package]
name = "cloakit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Terminal file/folder cloaking for Linux — encrypts contents, filenames, and the inventory itself."
authors = ["Gypsy-82 <262953538+Gypsy-82@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/Gypsy-82/cloakit"
publish = false

[lib]
name = "cloakit"
path = "src/lib.rs"

[[bin]]
name = "cloakit"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rpassword = "7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
toml = "0.8"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
